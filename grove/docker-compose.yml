services:
  rock-grove:
    image: datashield/rock-grove:0.0.0.9000
    ports:
      - "${PORT:-18085}:8085"

    environment:
      ROCK_ADMINISTRATOR_NAME: ${ROCK_ADMINISTRATOR_NAME:?Set administrator name}
      ROCK_ADMINISTRATOR_PASSWORD: ${ROCK_ADMINISTRATOR_PASSWORD:?Set administrator password}
      ROCK_MANAGER_NAME: ${ROCK_MANAGER_NAME:?Set manager name}
      ROCK_MANAGER_PASSWORD: ${ROCK_MANAGER_PASSWORD:?Set manager password}
      ROCK_USER_NAME: ${ROCK_USER_NAME:?Set user name}
      ROCK_USER_PASSWORD: ${ROCK_USER_PASSWORD:?Set user password}
      ROCK_ID: ${ROCK_ID:-rock-grove-01}
      ROCK_CLUSTER: ${ROCK_CLUSTER:-GROVE}
      ROCK_TAGS: ${ROCK_TAGS:-grove,geospatial,tidyverse}
      ROCK_SERVER: ${ROCK_SERVER:-}
      ROCK_OPAL_SERVER: ${ROCK_OPAL_SERVER:-}
      ROCK_OPAL_TOKEN: ${ROCK_OPAL_TOKEN:-}

    volumes:
      - rock_home:/srv

volumes:
  rock_home:
